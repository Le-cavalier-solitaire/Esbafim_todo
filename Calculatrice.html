<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Calculatrice</title>
    <link rel="stylesheet" href="cals.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="calc" role="application" aria-label="Calculatrice">
        <div class="screen" id="screen">
          <div class="history" id="history">&nbsp;</div>
          <div class="current" id="current">0</div>
        </div>
        <div class="keys">
          <button id="clear" class="danger">AC</button>
          <button id="del">Supp</button>
          <button class="operator" data-op="/">÷</button>
          <button class="operator" data-op="*">×</button>

          <button class="num">7</button>
          <button class="num">8</button>
          <button class="num">9</button>
          <button class="operator" data-op="-">−</button>

          <button class="num">4</button>
          <button class="num">5</button>
          <button class="num">6</button>
          <button class="operator" data-op="+">+</button>

          <button class="num">1</button>
          <button class="num">2</button>
          <button class="num">3</button>
          <button class="equal" id="equals">=</button>

          <button class="num wide">0</button>
          <button class="num">.</button>
        </div>
      </div>
    </div>

    <script src="calc.js"></script>
  </body>
</html>
